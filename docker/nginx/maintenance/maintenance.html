<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>در حال به‌روزرسانی</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 3.5vw, 30px);
    padding: 24px;
    text-align: center;
    background: #ffffff;
    color: #16233f;
    font-family: "Vazirmatn", "IRANSans", "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .logo {
    width: min(420px, 74vw);
    height: auto;
    display: block;
  }
  .msg {
    font-size: clamp(1rem, 4.6vw, 1.5rem);
    font-weight: 600;
    line-height: 1.9;
    letter-spacing: .2px;
  }
  @media (max-width: 360px) {
    .logo { width: 82vw; }
  }
</style>
</head>
<body>
  <img class="logo" src="/raga-logo.png" alt="RagaSoftWare">
  <p class="msg">سایت در حال به‌روزرسانی می‌باشد</p>
</body>
</html>
