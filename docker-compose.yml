services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dashboard_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    networks:
      - dashboard

  nginx:
    image: nginx:alpine
    container_name: dashboard_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - dashboard

  vite:
    image: node:22-alpine
    container_name: dashboard_vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      VITE_HOST: "${VITE_HOST}"
    command: sh -c "[ -d node_modules/vite ] || npm install; npm run dev -- --host 0.0.0.0"
    # Vite فقط دستی و برای توسعه: docker compose --profile dev up -d vite
    # (با up -d عادی/Restart سیستم بالا نمی‌آید؛ وگرنه public/hot ساخته می‌شود و Demo سفید می‌شود)
    restart: "no"
    profiles: ["dev"]
    networks:
      - dashboard

  # Web Push — پردازشگرِ پس‌زمینه (Laravel Scheduler: هر دقیقه push:dispatch و روزانه push:cleanup).
  # تنها روشِ مصوبِ اجرایِ Scheduler است؛ رویِ IIS یا نمونه‌هایِ دیگرِ برنامه Scheduler اجرا نشود.
  # فعال‌سازی: docker compose --profile push up -d scheduler   (پروفایلِ جدا: `docker compose up` عادی آن را بالا نمی‌آورد)
  # جلوگیری از اجرایِ هم‌زمان: یک نمونه (container_name ثابت) + قفلِ مشترکِ دیتابیس (withoutOverlapping/onOneServer)
  # + Claimِ اتمیکِ Outbox در SQL. لاگ: docker logs dashboard_scheduler و storage/logs/push-*.log
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dashboard_scheduler
    restart: unless-stopped
    user: www-data
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["push"]
    networks:
      - dashboard

  # Global Search — Redis مستقلِ Rate Limit (کاملاً جدا از Redisِ اصلیِ برنامه).
  # رمز فقط در .env: GS_RATELIMIT_REDIS_PASSWORD (فقط نویسه‌های A-Z a-z 0-9 _ -). کاربر/ACL هنگامِ شروع از همان مقدار ساخته می‌شود.
  # فعال‌سازی/به‌روزرسانی: docker compose --profile globalsearch up -d gs-redis
  # (پروفایلِ جدا: روی سروری که هنوز Global Search ندارد، `docker compose up` عادی را تحت‌تأثیر قرار نمی‌دهد.)
  # برنامه با GS_RATELIMIT_REDIS_HOST=gs-redis و GS_RATELIMIT_REDIS_PORT=6379 به آن وصل می‌شود.
  gs-redis:
    image: redis:7.4.11-alpine
    container_name: dashboard_gs_redis
    restart: unless-stopped
    profiles: ["globalsearch"]
    command:
      - sh
      - -c
      - >-
        [ -n "$$GS_RATELIMIT_REDIS_PASSWORD" ] || { echo "GS_RATELIMIT_REDIS_PASSWORD is not set in .env" >&2; exit 1; };
        umask 077;
        printf 'user default on >%s ~gs:rl:* resetchannels -@all +ping +eval +evalsha +incr +pttl +pexpire +get +exists +info\n' "$$GS_RATELIMIT_REDIS_PASSWORD" > /tmp/users.acl;
        exec redis-server /usr/local/etc/redis/redis.conf --aclfile /tmp/users.acl
    environment:
      GS_RATELIMIT_REDIS_PASSWORD: "${GS_RATELIMIT_REDIS_PASSWORD:-}"
      REDISCLI_AUTH: "${GS_RATELIMIT_REDIS_PASSWORD:-}"
    volumes:
      - ./docker/gs-redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    tmpfs:
      - /tmp:size=1m
      - /data:size=16m
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    # فقط loopbackِ میزبان (برایِ بررسیِ سلامت و حالتِ IIS)؛ هرگز روی شبکه منتشر نمی‌شود.
    ports:
      - "127.0.0.1:${GS_REDIS_HOST_PORT:-6392}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - dashboard

volumes:
  app_vendor:
  vite_node_modules:

networks:
  dashboard:
    driver: bridge