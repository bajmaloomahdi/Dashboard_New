# Global Search rate-limit Redis (service `gs-redis` in docker-compose.yml).
# Completely separate from the application's main Redis. This file contains NO secrets:
# the ACL user/password is generated at container start from GS_RATELIMIT_REDIS_PASSWORD (.env).
bind 0.0.0.0
port 6379
protected-mode yes

# Counters are short-lived and must never be persisted.
save ""
appendonly no

# Small, bounded memory. noeviction = when full, writes fail -> the app fails CLOSED (HTTP 503),
# it never silently drops rate-limit counters.
maxmemory 64mb
maxmemory-policy noeviction
