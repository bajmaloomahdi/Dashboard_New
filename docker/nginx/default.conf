# ---------------------------------------------------------------
# HTTP (پورت 80) — فعلاً بدون redirect اجباری تا HTTPS مستقل تست شود
# ---------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 100M;
    client_body_timeout 300s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # هدرهای forwarded را nginx به‌صورت authoritative ست می‌کند تا
        # مقدار ارسالی کلاینت/Cloudflare مستقیماً به Laravel نرسد
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.ht {
        deny all;
    }
}

# ---------------------------------------------------------------
# HTTPS (پورت 443) — TLS در همین nginx terminate می‌شود
# گواهی: Cloudflare Origin CA  (docker/nginx/certs/)
# ---------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 100M;
    client_body_timeout 300s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # nginx خودش TLS را terminate کرده → به PHP اعلام می‌کنیم اتصال امن است
        fastcgi_param HTTPS "on";

        # هدرهای forwarded را nginx به‌صورت authoritative ست می‌کند تا
        # مقدار ارسالی کلاینت/Cloudflare مستقیماً به Laravel نرسد
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.ht {
        deny all;
    }
}
