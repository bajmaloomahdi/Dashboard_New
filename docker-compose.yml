services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dashboard_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    networks:
      - dashboard

  nginx:
    image: nginx:alpine
    container_name: dashboard_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - dashboard

  vite:
    image: node:22-alpine
    container_name: dashboard_vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      VITE_HOST: "${VITE_HOST}"
    command: sh -c "[ -d node_modules/vite ] || npm install; npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    networks:
      - dashboard

volumes:
  app_vendor:
  vite_node_modules:

networks:
  dashboard:
    driver: bridge